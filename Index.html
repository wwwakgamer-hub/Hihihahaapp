<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Poppins', sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #6b214c 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #3c164d 0%, transparent 35%),
        linear-gradient(135deg, #120713, #250b1d, #100713);

    color: white;
}

/* ---------- STARS ---------- */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% {
        opacity: 0.2;
        transform: scale(1);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }
}

/* ---------- GLOW ---------- */

.glow {
    position: fixed;
    width: 350px;
    height: 350px;

    background: rgba(255, 71, 143, 0.12);
    filter: blur(80px);

    border-radius: 50%;
    pointer-events: none;
}

/* ---------- CARD ---------- */

.card {
    position: relative;
    width: min(90%, 450px);

    padding: 45px 28px;

    text-align: center;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-radius: 30px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45),
        inset 0 0 30px rgba(255,255,255,0.03);

    animation: cardAppear 1.2s ease;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ---------- HEART ---------- */

.main-heart {
    font-size: 60px;
    margin-bottom: 10px;

    filter: drop-shadow(0 0 15px rgba(255,70,140,0.7));

    animation: heartbeat 1.6s infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.1);
    }

    60% {
        transform: scale(1);
    }
}

/* ---------- TEXT ---------- */

.small-text {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;

    color: #f3a5c4;

    margin-bottom: 15px;
}

h1 {
    font-family: 'Cormorant Garamond', serif;

    font-size: 38px;
    line-height: 1.15;

    font-weight: 600;

    margin-bottom: 15px;
}

.subtitle {
    color: rgba(255,255,255,0.72);

    font-size: 15px;
    line-height: 1.7;

    margin-bottom: 25px;
}

.message {
    min-height: 30px;

    color: #ff9fc3;

    font-size: 15px;
    font-weight: 500;

    margin-bottom: 25px;

    transition: 0.3s;
}

/* ---------- BUTTONS ---------- */

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;

    min-height: 55px;
}

button {
    border: none;
    border-radius: 50px;

    padding: 14px 25px;

    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

#yesBtn {
    color: white;

    background: linear-gradient(
        135deg,
        #ff4f91,
        #ff236f
    );

    box-shadow:
        0 8px 25px rgba(255,35,111,0.35);
}

#yesBtn:hover {
    transform: scale(1.08);

    box-shadow:
        0 10px 35px rgba(255,35,111,0.55);
}

#noBtn {
    color: #555;

    background: #fff;

    position: relative;
}

/* ---------- MOVIE DECORATION ---------- */

.movie {
    margin-top: 28px;

    font-size: 12px;

    color: rgba(255,255,255,0.45);

    letter-spacing: 1px;
}

/* ---------- FLOATING HEARTS ---------- */

.floating-heart {
    position: fixed;

    bottom: -40px;

    font-size: 20px;

    pointer-events: none;

    animation: floatHeart linear forwards;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}

/* ---------- SUCCESS ---------- */

.success-title {
    font-family: 'Cormorant Garamond', serif;

    font-size: 45px;

    color: #ffb1ce;

    margin-bottom: 15px;
}

.success-text {
    font-size: 16px;

    color: rgba(255,255,255,0.85);

    line-height: 1.8;
}

.movie-ticket {
    margin: 25px auto 0;

    padding: 15px;

    border: 1px dashed rgba(255,255,255,0.35);

    border-radius: 15px;

    color: #ffc0d7;

    font-size: 13px;

    letter-spacing: 1px;
}

/* ---------- MOBILE ---------- */

@media(max-width:500px) {

    .card {
        padding: 38px 22px;
    }

    h1 {
        font-size: 34px;
    }

    .main-heart {
        font-size: 52px;
    }

    button {
        padding: 13px 21px;
    }
}
</style>
</head>


<body>

<div class="stars"></div>

<div class="glow"></div>


<div class="card" id="card">

    <div class="main-heart">❤️</div>

    <div class="small-text">
        A little question...
    </div>

    <h1>
        Will you go on a movie date with me?
    </h1>

    <div class="subtitle">
        There's someone I'd really like to watch a movie with...
        🍿🎬
    </div>

    <div class="message" id="message"></div>

    <div class="buttons">

        <button id="yesBtn">
            Yes, I'd love to ❤️
        </button>

        <button id="noBtn">
            No 🙈
        </button>

    </div>

    <div class="movie">
        One movie • Two seats • Hopefully you & me ❤️
    </div>

</div>


<script>

/* =========================
   CREATE STARS
========================= */

const starsContainer =
    document.querySelector(".stars");

for(let i = 0; i < 80; i++){

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    starsContainer.appendChild(star);
}


/* =========================
   ELEMENTS
========================= */

const yesBtn =
    document.getElementById("yesBtn");

const noBtn =
    document.getElementById("noBtn");

const message =
    document.getElementById("message");

const card =
    document.getElementById("card");


let noCount = 0;


/* =========================
   NO MESSAGES
========================= */

const messages = [

    "Seriously? 🥺",

    "Are you sure? 👀",

    "Really? Think again... 😭",

    "It's just a movie date... 🍿",

    "I'll let you choose the movie. 🥹",

    "Okay, you're making this difficult... ❤️",

    "One last chance? 🥺❤️"

];


/* =========================
   YES BUTTON
========================= */

yesBtn.addEventListener("click", () => {

    card.innerHTML = `

        <div class="main-heart">
            💖
        </div>

        <div class="small-text">
            It's a date...
        </div>

        <div class="success-title">
            You said YES! ❤️
        </div>

        <div class="success-text">

            I was secretly hoping you would. 🥹

            <br><br>

            Now all we need is:

            <br>

            🎬 A good movie
            <br>
            🍿 Some popcorn
            <br>
            ❤️ And you

            <div class="movie-ticket">

                MOVIE DATE
                <br><br>
                YOU + ME
                <br>
                ONE BEAUTIFUL EVENING ❤️

            </div>

        </div>
    `;

    startHearts();

});


/* =========================
   NO BUTTON
========================= */

noBtn.addEventListener("click", () => {

    message.textContent =
        messages[
            Math.min(
                noCount,
                messages.length - 1
            )
        ];

    noCount++;

    moveNoButton();

});


/* =========================
   NO BUTTON ESCAPE
========================= */



function moveNoButton(){

    const padding = 15;

    const buttonWidth =
        noBtn.offsetWidth;

    const buttonHeight =
        noBtn.offsetHeight;


    const maxX =
        window.innerWidth -
        buttonWidth -
        padding;

    const maxY =
        window.innerHeight -
        buttonHeight -
        padding;


    const x =
        padding +
        Math.random() * Math.max(0,maxX-padding);

    const y =
        padding +
        Math.random() * Math.max(0,maxY-padding);


    noBtn.style.position = "fixed";

    noBtn.style.left = x + "px";

    noBtn.style.top = y + "px";


    const rotation =
        Math.random() * 20 - 10;

    noBtn.style.transform =
        `rotate(${rotation}deg)`;

}


/* =========================
   FLOATING HEARTS
========================= */

function startHearts(){

    const heartTypes = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💘",
        "💞"
    ];


    for(let i = 0; i < 35; i++){

        setTimeout(() => {

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.textContent =
                heartTypes[
                    Math.floor(
                        Math.random() *
                        heartTypes.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (15 + Math.random() * 25) + "px";


            heart.style.animationDuration =
                (4 + Math.random() * 4) + "s";


            document.body.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            },8000);


        },i * 120);

    }

}

</script>

</body>
</html>
